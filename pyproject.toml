[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-test-kit-tools"
version = "0.1.0"
description = "browser-test-kit's stdlib-only scripts, installed as top-level modules for `python -m <script>`"
requires-python = ">=3.9"

# Test-only. The default dev group is the browserless lane; browser adds Playwright.
# browser-test retains collection dependencies but omits development-only pip.
# Floors stay open-ended (>=). Resolved versions are pinned in uv.lock.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "PyYAML>=6.0.3",
    "pip>=26.2",
    { include-group = "pages" },
]
# The review pages (platform matrix, app digest) are built with PySaiyanWeBoo's web_ui; the pin is a commit.
# Move it with: uv lock --upgrade-package pysaiyanweboo
pages = [
    "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@e4c25ddba45b05850cfd2c9666638b1617254990",
]
browser = [
    "playwright>=1.64.1",
]

browser-test = [
    { include-group = "browser" },
    "pytest>=9.0.3",
    "PyYAML>=6.0.3",
]

# The installed stdlib API remains 3.9+, but project/uv environments are 3.11+.
[tool.uv]
environments = ["python_version >= '3.11'"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
browser = { requires-python = ">=3.11" }
browser-test = { requires-python = ">=3.11" }

[tool.setuptools]
# Every tools/*.py becomes a top-level module (src-layout discovery), so
# `python -m btk ...` works from any directory after installation.
package-dir = { "" = "tools" }

[tool.setuptools.data-files]
"share/browser-test-kit" = ["tools/route_trail_node.mjs", "tools/interaction.mjs", "tools/hit_probe.mjs", "tools/element_overlay.mjs", "tools/page_inspect.cjs", "tools/mirror_facts.mjs"]

"share/browser-test-kit/pillow_min" = ["vendor/pillow_min/pillow_min.py", "vendor/pillow_min/Ironmate-LICENSE"]
