name: Nano Docker same-input experiment
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Reviewed node:26.0.0-bookworm-slim@sha256:<64 lowercase hex> (linux/amd64)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nano-docker-experiment
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate digest and require experiment implementation
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/nano-docker-evidence"
          mkdir -p "$evidence"
          {
            echo "source=$GITHUB_SHA"
            if [[ ! "$BASE_IMAGE" =~ ^node:26\.0\.0-bookworm-slim@sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid reviewed base image: a fixed lowercase SHA-256 digest is required."
              exit 1
            fi
            for path in tools/nano_docker_compare.py tools/nano_docker_worker.py experiments/nano-docker/Dockerfile; do
              if [[ ! -f "$path" ]]; then
                echo "Registration only: missing $path. Select an approved ref containing PR #149."
                exit 1
              fi
            done
          } > >(tee "$evidence/preflight.stdout") 2> >(tee "$evidence/preflight.stderr" >&2)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.0.0'
      - name: Pin baseline npm
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Compare on one host (three paired trials)
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: python3 tools/nano_docker_compare.py --base-image "$BASE_IMAGE" --output "$RUNNER_TEMP/nano-docker-evidence"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nano-docker-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/nano-docker-evidence/docker-summary.json
            ${{ runner.temp }}/nano-docker-evidence/*.json
            ${{ runner.temp }}/nano-docker-evidence/*.stdout
            ${{ runner.temp }}/nano-docker-evidence/*.stderr
            ${{ runner.temp }}/nano-docker-evidence/seed/summary.json
            ${{ runner.temp }}/nano-docker-evidence/seed/cache-seal.json
            ${{ runner.temp }}/nano-docker-evidence/seed/source/**
            ${{ runner.temp }}/nano-docker-evidence/context/**
            ${{ runner.temp }}/nano-docker-evidence/dependency-evidence/*.json
            ${{ runner.temp }}/nano-docker-evidence/dependency-evidence/*.stdout
            ${{ runner.temp }}/nano-docker-evidence/dependency-evidence/*.stderr
            ${{ runner.temp }}/nano-docker-evidence/trial-*/*.json
            ${{ runner.temp }}/nano-docker-evidence/trial-*/*.stdout
            ${{ runner.temp }}/nano-docker-evidence/trial-*/*.stderr
            ${{ runner.temp }}/nano-docker-evidence/trial-*/jobs/*/*.json
            ${{ runner.temp }}/nano-docker-evidence/trial-*/jobs/*/*.stdout
            ${{ runner.temp }}/nano-docker-evidence/trial-*/jobs/*/*.stderr
            ${{ runner.temp }}/nano-docker-evidence/trial-*/jobs/*/failure.txt
            ${{ runner.temp }}/nano-docker-evidence/trial-*/jobs/*/test-results/**
            ${{ runner.temp }}/nano-docker-evidence/trial-*/evidence/*.json
            ${{ runner.temp }}/nano-docker-evidence/trial-*/evidence/*.stdout
            ${{ runner.temp }}/nano-docker-evidence/trial-*/evidence/*.stderr
            ${{ runner.temp }}/nano-docker-evidence/trial-*/evidence/test-results/**
