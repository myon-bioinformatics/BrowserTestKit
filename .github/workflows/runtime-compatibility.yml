name: Stdlib runtime compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  stdlib:
    timeout-minutes: 30
    name: Stdlib and base package / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Dependency-free source tests
        run: python -S -m unittest discover -s tests/stdlib -v
      - name: Image CLI help without site packages
        run: python -S tools/image_diff.py --help
      - name: Install the base distribution with no runtime dependencies
        run: |
          uv pip install --no-deps .
          cd "$RUNNER_TEMP"
          python -m btk --help
          python -c "from importlib.metadata import metadata; m = metadata('browser-test-kit-tools'); assert m['Requires-Python'] == '>=3.11'; assert m.get_all('Requires-Dist', []) == []"

  development-floor:
    timeout-minutes: 30
    name: Images and development / Python 3.11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Require Node 26 or newer
        shell: bash
        run: |
          node_major=$(node -p "process.versions.node.split('.')[0]")
          if [[ "$node_major" -lt 26 ]]; then
            echo "node ${node_major} is older than 26" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 0778ede0c872d609bb2dc590f9f9898a39a18668
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Resolve all supported groups from the lock
        run: uv sync --locked --all-groups
      - name: Image CLI at the supported floor
        run: python -S tools/image_diff.py --help
      - name: Full browserless regression suite at the supported floor
        run: uv run --locked python -m pytest tests/python -q -m 'not browser'
      - name: Build and inspect the distributable package
        run: |
          uv build
          uv run --locked python -m pytest tests/python/test_python_support.py -q
