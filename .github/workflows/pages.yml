name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only). The parent's reusable
# workflow renders it with the PySaiyanWeBoo commit pinned there — no HTML, CSS or JS lives in this repository.
# Pull requests build the page (an invalid spec fails there); only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "docs/assets/brand/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/assets/brand/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@1cd621c8a46d18611a9135bdc8a0e9d46013d58d
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_assets: docs/evidence/browser.gif=demos/browser.gif
      guide_brand: BrowserTestKit.validation-buddy   # ♻️ icon and favicon from CaChereCyCle (BrowserTestKit.validation-buddy.icon / .favicon)
      # 🖼 the two documentation marks (docs/fast-init.md, docs/screenshot-evidence.md), from the same store checkout
      build: >-
        python3 -S .cacherecycle/cacherecycle.py sync camera-validation.png=BrowserTestKit.camera-validation.icon
        pipeline-hub.png=BrowserTestKit.pipeline-hub.icon --cache _site/marks && rm -f _site/marks/.cacherecycle.json
